<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>
    <title>
      Account &mdash; F1 Merch
    </title>
    <link href="styles.css" rel="stylesheet"/>
  </head>
  <body>
    <header>
      <nav class="wrap subnav">
        <a class="brand" href="index.html">
          <svg class="brand-badge" viewbox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
            <rect fill="#14161C" height="240" rx="26" width="240">
            </rect>
            <circle cx="204" cy="34" fill="#E2231A" r="7">
            </circle>
            <text fill="#fff" font-family="Space Grotesk" font-size="96" font-weight="700" text-anchor="middle" x="120" y="118">
              F1
            </text>
            <text fill="#E2231A" font-family="Inter" font-size="18" font-weight="600" letter-spacing="5" text-anchor="middle" x="120" y="196">
              MERCH
            </text>
          </svg>
          <span class="brand-copy">
            <strong>
              F1 MERCH
            </strong>
            <small>
              GRID TO STREET
            </small>
          </span>
        </a>
        <button aria-expanded="false" class="mobile-menu" id="menuBtn">
          ☰
        </button>
        <div class="nav-links" id="navLinks">
          <a class="" href="index.html#lineup">
            Shop
          </a>
          <a class="" href="drops.html">
            Drops
          </a>
          <a class="" href="index.html#teams">
            Teams
          </a>
          <a class="" href="index.html#story">
            Story
          </a>
        </div>
        <div class="nav-actions">
          <a href="login.html" id="accountLink">
            Sign in
          </a>
          <a class="nav-cart-link" href="cart.html">
            Cart &middot;
            <span id="cartCount">
              0
            </span>
          </a>
        </div>
      </nav>
    </header>
    <main class="wrap account-main">
      <div class="page-title">
        <span class="eyebrow">
          CUSTOMER AREA
        </span>
        <h1>
          My account.
        </h1>
        <p>
          Profile, wishlist, and live package tracking.
        </p>
      </div>
      <div class="account-grid">
        <section class="account-card">
          <span class="section-kicker">
            PROFILE
          </span>
          <h2 id="profileHeading">
            Your profile
          </h2>
          <div class="profile-avatar" id="avatarPreview">
            ME
          </div>
          <form class="account-form" id="profileForm">
            <label>
              Display name
              <input id="name" required=""/>
            </label>
            <label>
              Email
              <input id="email" readonly=""/>
            </label>
            <label>
              Profile photo
              <input accept="image/jpeg,image/png,image/webp" id="avatarInput" type="file"/>
            </label>
            <label>
              Favorite team
              <input id="favoriteTeam" placeholder="Ferrari"/>
            </label>
            <label>
              Bio
              <textarea id="bio" maxlength="240"></textarea>
            </label>
            <button class="btn btn-primary" type="submit">
              Save profile
            </button>
            <button class="btn btn-logout" id="logoutBtn" type="button">
              LOG OUT
            </button>
            <p id="profileMessage">
            </p>
          </form>
        </section>
        <section class="account-card">
          <div class="orders-title">
            <div>
              <span class="section-kicker">
                ORDERS
              </span>
              <h2>
                Package status
              </h2>
            </div>
            <span id="orderCount">
            </span>
          </div>
          <div class="orders-list" id="ordersList">
          </div>
        </section>
      </div>
      <section class="account-card wishlist-card">
        <div class="orders-title">
          <div>
            <span class="section-kicker">
              SAVED GRID
            </span>
            <h2>
              Wishlist
            </h2>
          </div>
        </div>
        <div class="product-grid compact" id="wishlistGrid">
        </div>
      </section>
    </main>
    <script src="auth-client.js">
    </script>
    <script src="auth-nav.js?v=1">
    </script>
    <script src="products-data.js">
    </script>
    <script src="account.js?v=27">
    </script>
  </body>
</html>
